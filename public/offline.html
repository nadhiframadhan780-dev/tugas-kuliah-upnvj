<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline - Planner Akuntansi UPNVJ</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #F0FDFA;
      color: #0F172A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: white;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(13, 148, 136, 0.1);
      max-width: 420px;
    }
    h1 { color: #0D9488; margin-bottom: 12px; font-size: 1.5rem; }
    p { color: #475569; font-size: 0.95rem; line-height: 1.5; }
    .btn {
      margin-top: 20px;
      display: inline-block;
      background: #0D9488;
      color: white;
      padding: 10px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div style="font-size: 48px; margin-bottom: 16px;">📚</div>
    <h1>Mode Offline</h1>
    <p>Anda sedang tidak terhubung ke internet. Data tugas dan jadwal Anda yang tersimpan di IndexedDB tetap aman dan dapat diakses saat kembali ke aplikasi.</p>
    <a href="/" class="btn" onclick="window.location.reload(); return false;">Coba Muat Ulang</a>
  </div>
</body>
</html>
